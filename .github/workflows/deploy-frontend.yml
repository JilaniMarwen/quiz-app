# Builds frontend/ and deploys it to GitHub Pages on every push to main.
# Repository settings needed:
#   Settings → Pages → Source: GitHub Actions
#   Settings → Secrets and variables → Actions → Variables:
#     VITE_API_URL     (optional, overrides frontend/.env.production) e.g. https://quiz-app-api.up.railway.app/api
#     VITE_PUBLIC_URL  (optional) address shown in the dashboard QR code
name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # API URL: repository variable VITE_API_URL if set, otherwise frontend/.env.production.
      - name: Build
        run: |
          if [ -n "${{ vars.VITE_API_URL }}" ]; then
            export VITE_API_URL="${{ vars.VITE_API_URL }}"
          elif ! grep -q '^VITE_API_URL=' .env.production 2>/dev/null; then
            echo "::error::No API URL: set the VITE_API_URL repository variable or frontend/.env.production."
            exit 1
          fi
          if [ -n "${{ vars.VITE_PUBLIC_URL }}" ]; then
            export VITE_PUBLIC_URL="${{ vars.VITE_PUBLIC_URL }}"
          fi
          npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
